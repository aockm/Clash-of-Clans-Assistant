mode: run                     # run | debug：debug 输出 DEBUG 日志，并把画面存到 screenshots/debug/

device:
  serial: null                # null 表示自动取第一台设备
  game_package: com.supercell.clashofclans  # 游戏包名：用于未启动时拉起/重启
  scrcpy_max_size: 1280       # 视频编码最大边长
  scrcpy_bit_rate: 8000000
  frame_buffer_size: 10

paths:
  templates_dir: assets/templates

safety:
  click_jitter_px: 15         # 点击坐标 ±随机偏移
  action_delay_range: [0.3, 0.8]
  confirm_frames: 2           # 状态确认所需连续一致帧数
  max_attacks_per_session: [8, 12]

attack:
  town_hall_level: 3        # 本人大本营等级：决定默认资源门槛
  min_loot_gold: null         # 留空则按大本营等级取默认值；填数字可强制覆盖
  min_loot_elixir: null
  max_next_attempts: 20       # 搜索对手最多“下一个”次数

deploy:
  card_slot_start: [250, 518] # 底部首个兵种卡牌中心（视频坐标）
  card_slot_pitch: 81         # 相邻卡牌中心间距
  card_slot_count: 11         # 卡槽总数
  boundary_margin: 40         # 红区外扩距离，部署点落在红区外
  max_rounds: 7               # 每个兵种最多投放轮次（每轮把所有边界点各点一次）
  map_bottom: 365             # 卡牌栏起始 y，边界线低于此值会被遮挡
  max_recenter: 3             # 底部边界被遮挡时，最多向下拖动地图的次数

battle_end:
  sample_interval: 5          # 摧毁率/战利品采样间隔（秒）
  stable_samples: 3           # 连续多少次采样摧毁率不变视为稳定
  stall_seconds: 15           # 敌方资源无变化超过该时长则结束战斗
  history_size: 10            # 保留最近采样数

upgrade:
  enabled: true
  row_x: 1094                 # 点击列表行的 x 坐标（行 y 由右侧货币图标动态识别）
  cooldown: 20                # 两次升级尝试的最小间隔（秒）
  panel_timeout: 2.5          # 点“建造”后等待列表出现的时限
  confirm_timeout: 2.5        # 点列表行后等待确认框的时限
  max_failures: 3             # 连续失败上限，达到后本会话不再升级
  nobuilder_cooldown: 600     # 工人全忙时暂停升级的时长（秒）

accounts:
  enabled: true
  names:                      # 按顺序轮换；每个账号打满场次后切下一个
    - Murphy11111
    - NingYaoSword
    - OriginalALiang
    - SolidCuiCHan
    - MudBottleAlley
  attacks_per_account: 3      # 每个账号打几场后切换（0 表示沿用 safety 的随机区间）
  reward_taps: 5              # 切号加载页出现宝箱奖励时连续点击次数
  th_cache_hours: 168         # 大本营等级缓存有效期（7 天），过期后重新识别
  loot_full_ratio: 0.95       # 资源条填充≥该比例视为资源已满
  skip_valid_hours: 6         # “资源已满且无可升级”时跳过该账号的有效期，过期后重试

redis:                        # 账号状态（大本营等级/在建建筑完成时间等）
  enabled: true
  host: 127.0.0.1
  port: 6379
  db: 0
  prefix: coc

schedule:                     # 定时启动：打完一轮后，等到下一个启动点再开下一轮
  enabled: true
  interval_minutes: 15        # 启动点间隔（分钟），从 0 点起算
  day_offset: true            # 启动点再偏移“当天日期 % 10”分钟，错开整点

logging:
  level: INFO
