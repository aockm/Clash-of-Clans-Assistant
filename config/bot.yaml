# Clash of Clans Assistant - 配置文件

# 设备配置
device:
  adb_path: "adb"
  device_serial: null  # null 表示自动选择第一个设备
  video_width: 720
  video_height: 1280
  scrcpy_server_path: "assets/scrcpy-server-v2.1"  # scrcpy-server.jar 本地路径

# 视觉配置
vision:
  templates_dir: "assets/templates"
  ocr_upscale_factor: 3
  template_threshold: 0.8

# 状态机配置
state_machine:
  confirm_frames:
    POPUP: 2
    BATTLE_RESULTS: 2
    ENEMY_BASE: 1

# 功能开关
features:
  enable_collect: true
  enable_upgrade: true
  enable_donate: true
  enable_attack: true

# 任务优先级（数值越大优先级越高）
priority:
  donate: 10
  collect: 8
  upgrade: 6
  attack: 4

# 资源收集配置
collector:
  collect_interval: 30.0  # 收集间隔（秒）
  click_delay: [0.3, 0.8]

# 建筑升级配置
upgrader:
  action_delay: [0.5, 1.2]
  confirm_delay: [0.3, 0.8]

# 攻击搜索配置
attacker:
  min_gold: 50000
  min_elixir: 50000
  min_dark_elixir: 0
  max_skip_count: 5
  search_timeout: 30.0

# 战斗部署配置
deployer:
  deploy_zone_padding: 20
  hero_ability_delay: [4.0, 6.0]
  # 兵种按战斗画面底部兵种栏槽位动态检测并全部部署，无需配置模板
  # 英雄如需技能模板可在此配置（未配置时英雄随兵种栏一并动态部署）
  heroes: []

# 攻击/自动配兵配置
attacker:
  army:
    # 默认不配置：军队页面直接点"进攻"，沿用游戏记忆配好的兵
    # 仅当需要特定兵种组合时，取消下方注释启用自动配兵（清空部队→按序添加→进攻）
    # 注意：兵种必须已在兵营训练，否则清空后部队为空无法进攻
    troops: []
    # troops:
    #   - name: "野蛮人"
    #     template: "pick_barbarian"
    #   - name: "弓箭手"
    #     template: "pick_archer"
    #   - name: "女武神"
    #     template: "pick_valkyrie"

# 安全配置
safety:
  # 点击随机化
  click_offset: 5  # 像素（作用于视频坐标，勿设太大以免小目标点击打偏）
  
  # 延迟随机化
  delay_range: [0.3, 0.8]
  long_delay_range: [1.0, 3.0]
  
  # 会话控制
  session:
    max_duration: 3600  # 最大运行时长（秒）
    min_duration: 1800  # 最小运行时长（秒）
    max_attacks: 12     # 最大攻击次数
    min_attacks: 8      # 最小攻击次数
    break_probability: 0.1
    break_duration: [30.0, 120.0]

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/bot.log"
